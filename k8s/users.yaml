apiVersion: v1
kind: ConfigMap
metadata:
  name: users-config
  namespace: cafeteria
data:
  DB_HOST: "users-db"
  DB_PORT: "5432"
  DB_DATABASE: "users_db"
  APP_PORT: "8081"
---
apiVersion: v1
kind: Secret
metadata:
  name: users-secret
  namespace: cafeteria
type: Opaque
stringData:
  DB_USERNAME: "dev"
  DB_PASSWORD: "root1234"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: cafeteria
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:alpine
          env:
            - name: POSTGRES_DB
              value: "users_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: users-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dev", "-d", "users_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dev", "-d", "users_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: users-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: users-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: cafeteria
spec:
  selector:
    app: users-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: cafeteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: users-service
          image: cafeteria-users:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: users-config
            - secretRef:
                name: users-secret
          ports:
            - containerPort: 8081
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: cafeteria
spec:
  selector:
    app: users-service
  ports:
    - port: 8081
      targetPort: 8081
