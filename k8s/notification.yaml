apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: cafeteria
data:
  DB_HOST: "notification-db"
  DB_PORT: "5432"
  DB_DATABASE: "notification_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/"
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-secret
  namespace: cafeteria
type: Opaque
stringData:
  DB_USERNAME: "dev"
  DB_PASSWORD: "root1234"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notification-db
  namespace: cafeteria
spec:
  serviceName: notification-db
  replicas: 1
  selector:
    matchLabels:
      app: notification-db
  template:
    metadata:
      labels:
        app: notification-db
    spec:
      containers:
        - name: postgres
          image: postgres:alpine
          env:
            - name: POSTGRES_DB
              value: "notification_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: DB_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notification-secret
                  key: DB_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "dev", "-d", "notification_db"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "dev", "-d", "notification_db"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          volumeMounts:
            - name: notification-db-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: notification-db-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-db
  namespace: cafeteria
spec:
  selector:
    app: notification-db
  ports:
    - port: 5432
      targetPort: 5432
  clusterIP: None
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: cafeteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: cafeteria-notification:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: notification-config
            - secretRef:
                name: notification-secret
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: cafeteria
spec:
  selector:
    app: notification-service
  ports:
    - port: 80
      targetPort: 80
