apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: cafeteria
data:
  APP_PORT: "8000"
  CORE_SERVICE_URL: "http://core-service:8080"
  USERS_SERVICE_URL: "http://users-service:8081"
  WORKFLOW_SERVICE_URL: "http://workflow-service:8082"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cafeteria
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: cafeteria-gateway:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /core/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /core/health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cafeteria
spec:
  selector:
    app: gateway
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000
