volumes:
  core_db_data:
  users_db_data:
  notification_db_data:
  workflow_db_data:

networks:
  cafeteria_network:
    driver: bridge

services:
  # rabbitmq
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - cafeteria_network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 10s
      retries: 5

  # core database
  core_database:
    image: postgres:alpine
    container_name: core_database
    ports:
      - "${CORE_DB_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CORE_DB_USERNAME}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}
      POSTGRES_DB: ${CORE_DB_DATABASE}
    volumes:
      - core_db_data:/var/lib/postgresql/data
    networks:
      - cafeteria_network

  # core migrations
  core_migrations:
    image: migrate/migrate
    volumes:
      - ./database/base/migrations:/migrations
    command: -path=/migrations -database "postgres://${CORE_DB_USERNAME}:${CORE_DB_PASSWORD}@core_database:5432/${CORE_DB_DATABASE}?sslmode=disable" up
    depends_on:
      - core_database
    restart: on-failure
    networks:
      - cafeteria_network

  # core seed
  core_seed:
    image: postgres:alpine
    volumes:
      - ./database/base/seeds/seed.sql:/seed.sql
    command: psql "postgres://${CORE_DB_USERNAME}:${CORE_DB_PASSWORD}@core_database:5432/${CORE_DB_DATABASE}?sslmode=disable" -f /seed.sql
    depends_on:
      - core_migrations
    restart: on-failure
    networks:
      - cafeteria_network

  # core service
  core_service:
    build:
      context: .
      dockerfile: docker/base/Dockerfile
    container_name: core_service
    environment:
      APP_PORT: ${CORE_APP_PORT:-8080}
      DB_HOST: ${CORE_DB_HOST:-core_database}
      DB_PORT: 5432
      DB_USERNAME: ${CORE_DB_USERNAME}
      DB_PASSWORD: ${CORE_DB_PASSWORD}
      DB_DATABASE: ${CORE_DB_DATABASE}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://users_service:8081}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    volumes:
      - .:/go/src/app
    depends_on:
      core_database:
        condition: service_started
      core_migrations:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - cafeteria_network

  # users database
  users_database:
    image: postgres:alpine
    container_name: users_database
    ports:
      - "${USERS_DB_PORT:-5433}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${USERS_DB_USERNAME}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_DATABASE}
    volumes:
      - users_db_data:/var/lib/postgresql/data
    networks:
      - cafeteria_network

  # users migrations
  users_migrations:
    image: migrate/migrate
    volumes:
      - ./database/users/migrations:/migrations
    command: -path=/migrations -database "postgres://${USERS_DB_USERNAME}:${USERS_DB_PASSWORD}@users_database:5432/${USERS_DB_DATABASE}?sslmode=disable" up
    depends_on:
      - users_database
    restart: on-failure
    networks:
      - cafeteria_network

  # users seed
  users_seed:
    image: postgres:alpine
    volumes:
      - ./database/users/seeds/seed.sql:/seed.sql
    command: psql "postgres://${USERS_DB_USERNAME}:${USERS_DB_PASSWORD}@users_database:5432/${USERS_DB_DATABASE}?sslmode=disable" -f /seed.sql
    depends_on:
      - users_migrations
    restart: on-failure
    networks:
      - cafeteria_network

  # users service
  users_service:
    build:
      context: .
      dockerfile: docker/users/Dockerfile
    container_name: users_service
    environment:
      APP_PORT: ${USERS_APP_PORT:-8081}
      DB_HOST: ${USERS_DB_HOST:-users_database}
      DB_PORT: 5432
      DB_USERNAME: ${USERS_DB_USERNAME}
      DB_PASSWORD: ${USERS_DB_PASSWORD}
      DB_DATABASE: ${USERS_DB_DATABASE}
    volumes:
      - .:/go/src/app
    depends_on:
      - users_database
      - users_migrations
    networks:
      - cafeteria_network

  # notification database
  notification_database:
    image: postgres:alpine
    container_name: notification_database
    ports:
      - "${NOTIFICATION_DB_PORT:-5434}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_DB_DATABASE}
    volumes:
      - notification_db_data:/var/lib/postgresql/data
    networks:
      - cafeteria_network

  # notification migrations
  notification_migrations:
    image: migrate/migrate
    volumes:
      - ./database/notification/migrations:/migrations
    command: -path=/migrations -database "postgres://${NOTIFICATION_DB_USERNAME}:${NOTIFICATION_DB_PASSWORD}@notification_database:5432/${NOTIFICATION_DB_DATABASE}?sslmode=disable" up
    depends_on:
      - notification_database
    restart: on-failure
    networks:
      - cafeteria_network

  # notification service
  notification_service:
    build:
      context: .
      dockerfile: docker/notification/Dockerfile
    container_name: notification_service
    environment:
      DB_HOST: ${NOTIFICATION_DB_HOST:-notification_database}
      DB_PORT: 5432
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      DB_DATABASE: ${NOTIFICATION_DB_DATABASE}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}
    volumes:
      - .:/go/src/app
    depends_on:
      notification_database:
        condition: service_started
      notification_migrations:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - cafeteria_network

  # workflow database
  workflow_database:
    image: postgres:alpine
    container_name: workflow_database
    ports:
      - "${WORKFLOW_DB_PORT:-5435}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${WORKFLOW_DB_USERNAME}
      POSTGRES_PASSWORD: ${WORKFLOW_DB_PASSWORD}
      POSTGRES_DB: ${WORKFLOW_DB_DATABASE}
    volumes:
      - workflow_db_data:/var/lib/postgresql/data
    networks:
      - cafeteria_network

  # workflow migrations
  workflow_migrations:
    image: migrate/migrate
    volumes:
      - ./database/workflow/migrations:/migrations
    command: -path=/migrations -database "postgres://${WORKFLOW_DB_USERNAME}:${WORKFLOW_DB_PASSWORD}@workflow_database:5432/${WORKFLOW_DB_DATABASE}?sslmode=disable" up
    depends_on:
      - workflow_database
    restart: on-failure
    networks:
      - cafeteria_network

  # workflow service
  workflow_service:
    build:
      context: .
      dockerfile: docker/workflow/Dockerfile
    container_name: workflow_service
    environment:
      APP_PORT: ${WORKFLOW_APP_PORT:-8082}
      DB_HOST: ${WORKFLOW_DB_HOST:-workflow_database}
      DB_PORT: 5432
      DB_USERNAME: ${WORKFLOW_DB_USERNAME}
      DB_PASSWORD: ${WORKFLOW_DB_PASSWORD}
      DB_DATABASE: ${WORKFLOW_DB_DATABASE}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://users_service:8081}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL:-http://core_service:8080}
    volumes:
      - .:/go/src/app
    depends_on:
      - workflow_database
      - workflow_migrations
      - users_service
      - core_service
    networks:
      - cafeteria_network

  # gateway
  gateway:
    build:
      context: .
      dockerfile: docker/gateway/Dockerfile
    container_name: gateway
    ports:
      - "${GATEWAY_PUBLIC_PORT:-8000}:${GATEWAY_APP_PORT:-8000}"
    environment:
      APP_PORT: ${GATEWAY_APP_PORT:-8000}
      CORE_SERVICE_URL: ${CORE_SERVICE_URL:-http://core_service:8080}
      USERS_SERVICE_URL: ${USERS_SERVICE_URL:-http://users_service:8081}
      WORKFLOW_SERVICE_URL: ${WORKFLOW_SERVICE_URL:-http://workflow_service:8082}
    volumes:
      - .:/go/src/app
    depends_on:
      - core_service
      - users_service
      - workflow_service
    networks:
      - cafeteria_network