# Volumes
volumes:
  cafeteria_delivery_db_data:

# Networks
networks:
  cafeteria_delivery_network:
    driver: bridge

services:
  # database
  cafeteria_delivery_database:
    image: postgres:alpine
    container_name: cafeteria_delivery_database
    ports:
      - "${DB_PORT:-5432}:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - cafeteria_delivery_db_data:/var/lib/postgresql/data
    networks:
      - cafeteria_delivery_network

  # migrations
  cafeteria_delivery_migrations:
    image: migrate/migrate
    volumes:
      - ./database/migrations:/migrations
    command: -path=/migrations -database "postgres://${DB_USERNAME}:${DB_PASSWORD}@cafeteria_delivery_database:5432/${DB_DATABASE}?sslmode=disable" up
    depends_on:
      - cafeteria_delivery_database
    restart: on-failure
    networks:
      - cafeteria_delivery_network

  # seed
  cafeteria_delivery_seed:
    image: postgres:alpine
    volumes:
      - ./database/seeds/seed.sql:/seed.sql
    command: psql "postgres://${DB_USERNAME}:${DB_PASSWORD}@cafeteria_delivery_database:5432/${DB_DATABASE}?sslmode=disable" -f /seed.sql
    depends_on:
      - cafeteria_delivery_migrations
    restart: on-failure
    networks:
      - cafeteria_delivery_network

  # api
  cafeteria_delivery_api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env
    ports:
      - "${PUBLIC_PORT}:${LISTEN_PORT}"
    volumes:
      - .:/go/src/app
    depends_on:
      - cafeteria_delivery_database
      - cafeteria_delivery_migrations
    networks:
      - cafeteria_delivery_network